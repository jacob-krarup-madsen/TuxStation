name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4.1.1
      - uses: actions/setup-python@v5 # v5.1.0
        with:
          python-version: '3.11'
      - run: python -m py_compile $(find . -name "*.py" | head -20) || echo "no py"
      - run: pip install -r requirements.txt 2>/dev/null || echo "no requirements"
      - run: python -m pytest -q 2>/dev/null || echo "no tests"
